services:
  postgres:
    build:
      context: .
      dockerfile: infrastructure/postgres/Dockerfile
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
      TZ: America/Santiago
      PGTZ: America/Santiago
    volumes:
      - postgres_data:/var/lib/postgresql/data
    tmpfs:
      - /tmp
      - /var/run/postgresql
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 10
    mem_limit: 512m
    networks:
      - data

  backend:
    build: ./backend
    restart: unless-stopped
    init: true
    stop_grace_period: 15s
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - ${APP_ENV_FILE:-.env}
    environment:
      DB_USER: ${DB_USER}
      DB_HOST: postgres
      DB_NAME: ${DB_NAME}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_PORT: 5432
      JWT_SECRET: ${JWT_SECRET}
      CORS_ORIGIN: ${CORS_ORIGIN}
      PORT: 5000
      NODE_ENV: ${NODE_ENV:-production}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      APP_TIMEZONE: America/Santiago
      UPLOADS_DIR: /app/uploads
      DB_POOL_MAX: 10
    volumes:
      - uploads_data:/app/uploads
    tmpfs:
      - /tmp
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:5000/api/health/ready').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    mem_limit: 256m
    networks:
      - edge
      - data

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: /api
        VITE_INSTITUTION_NAME: ${INSTITUTION_NAME:-Establecimiento educativo}
        VITE_INSTITUTION_SHORT_NAME: ${INSTITUTION_SHORT_NAME:-}
        VITE_INSTITUTION_RBD: ${INSTITUTION_RBD:-}
        VITE_INSTITUTION_LOCATION: ${INSTITUTION_LOCATION:-}
        VITE_INSTITUTION_LOGO_URL: ${INSTITUTION_LOGO_URL:-/brand/purocole-mark.svg}
        VITE_BRAND_PRIMARY: ${BRAND_PRIMARY:-28618c}
        VITE_BRAND_ACCENT: ${BRAND_ACCENT:-d8a447}
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:8080"
    depends_on:
      backend:
        condition: service_healthy
    tmpfs:
      - /tmp
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:8080/healthz | grep -q ok"]
      interval: 15s
      timeout: 5s
      retries: 5
    mem_limit: 128m
    networks:
      - edge

  backup:
    build:
      context: .
      dockerfile: infrastructure/postgres/Dockerfile
    restart: unless-stopped
    user: "1000:1000"
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - ${APP_ENV_FILE:-.env}
    environment:
      DB_HOST: postgres
      PGPASSWORD: ${DB_PASSWORD}
      TZ: America/Santiago
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-30}
      BACKUP_MIRROR_DIR: ${BACKUP_MIRROR_DIR:-}
    volumes:
      - ${BACKUP_HOST_DIR:-./backups}:/backups
      - uploads_data:/uploads:ro
      - ./backend/backup.sh:/backup.sh:ro
      - ./backend/restore.sh:/restore.sh:ro
    tmpfs:
      - /tmp
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    entrypoint: >
      sh -c "
      echo 'Servicio de respaldo diario iniciado.';
      while true; do
        if sh /backup.sh; then
          sleep 86400;
        else
          echo 'El respaldo falló; se reintentará en 5 minutos.';
          sleep 300;
        fi;
      done
      "
    healthcheck:
      test: ["CMD-SHELL", "test -s /backups/last-success.env && test $$(find /backups/last-success.env -mmin -1500 | wc -l) -eq 1"]
      interval: 5m
      timeout: 10s
      retries: 3
      start_period: 2m
    mem_limit: 256m
    networks:
      - data

volumes:
  postgres_data:
  uploads_data:

networks:
  edge:
  data:
    internal: true
